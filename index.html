<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0d">
<title>A.V.I.L.U.S — Gallery · B9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0d; --panel:#131217;
  --line:rgba(236,231,219,.08); --line-2:rgba(236,231,219,.17);
  --txt:#ece9e1; --mut:#8f8b98;
  --amber:#f0a63f;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--txt);font-family:'Space Grotesk',ui-sans-serif,sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
svg{display:block}

header{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;height:56px;background:rgba(10,10,13,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{font-family:Syne;font-weight:800;font-size:15px;letter-spacing:.14em}
.brand i{font-style:normal;color:var(--mut);font-size:9px;letter-spacing:.22em;margin-left:8px;vertical-align:2px}
.actions{display:flex;gap:8px}
.actions button{display:flex;align-items:center;gap:7px;padding:8px 13px;border:1px solid var(--line-2);
  border-radius:8px;font-size:13px;color:var(--mut);transition:.18s}
.actions button:hover{border-color:rgba(240,166,63,.55);color:var(--amber)}
.actions button svg{width:15px;height:15px}
@media(max-width:640px){.actions button span{display:none}header{padding:0 14px}}

main{max-width:1280px;margin:0 auto;padding:80px 22px 90px}
#grid{position:relative;width:100%}
#grid figure{position:absolute;overflow:hidden;border-radius:7px;background:#141318;cursor:zoom-in;
  outline:1px solid rgba(236,231,219,.06);outline-offset:-1px;transition:outline-color .25s,box-shadow .25s}
#grid figure img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .18s}
#grid figure:hover{outline-color:rgba(240,166,63,.6);z-index:2}
#grid figure:hover img{filter:brightness(1.07)}
#grid figure.carried{outline:2px solid rgba(240,166,63,.8);box-shadow:0 0 22px rgba(240,166,63,.28);z-index:2}
#grid figure .rx{position:absolute;top:7px;left:7px;font-size:9px;letter-spacing:.18em;color:var(--amber);
  border:1px solid rgba(240,166,63,.55);background:rgba(10,10,13,.6);padding:2px 5px;border-radius:3px}

#empty{display:none;place-items:center;border:1px dashed var(--line-2);border-radius:14px;min-height:320px;text-align:center;padding:30px}
#empty p{color:var(--mut);font-size:13px;margin-bottom:18px}
.btn-solid{background:var(--amber);color:#181004;font-weight:600;padding:10px 18px;border-radius:8px;
  display:inline-flex;align-items:center;gap:8px;font-size:13px;transition:.18s}
.btn-solid:hover{filter:brightness(1.08)}
.btn-solid svg{width:15px;height:15px}

#lightbox{position:fixed;inset:0;z-index:60;background:rgba(7,7,9,.94);display:flex;align-items:center;justify-content:center;
  opacity:1;transition:opacity .3s}
#lightbox.out{opacity:0}
#lbImg{max-width:88vw;max-height:76vh;border-radius:4px;will-change:transform,opacity;
  box-shadow:0 26px 80px rgba(0,0,0,.6)}
#lbImg.armed{animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{
  0%,100%{box-shadow:0 26px 80px rgba(0,0,0,.6),0 0 0 1px rgba(240,166,63,.25),0 0 26px rgba(240,166,63,.18)}
  50%{box-shadow:0 26px 80px rgba(0,0,0,.6),0 0 0 2px rgba(240,166,63,.6),0 0 54px rgba(240,166,63,.42)}
}
#lbImg.mat{animation:mat .65s cubic-bezier(.2,.9,.3,1.2)}
@keyframes mat{
  0%{transform:scale(.88);filter:brightness(2) saturate(1.3);
     box-shadow:0 0 0 3px rgba(240,166,63,.9),0 0 90px rgba(240,166,63,.7)}
  100%{transform:scale(1);filter:none}
}
#lbClose,#lbDel,#lbDl{position:absolute;top:16px;width:40px;height:40px;border:1px solid var(--line-2);border-radius:50%;
  display:grid;place-items:center;color:var(--mut);transition:.18s;background:rgba(19,18,23,.7)}
#lbClose{right:16px}#lbDl{right:64px}#lbDel{left:16px}
#lbClose:hover,#lbDel:hover,#lbDl:hover{border-color:var(--amber);color:var(--amber)}
#lbClose svg,#lbDel svg,#lbDl svg{width:16px;height:16px}
#lbGrab{position:absolute;right:22px;bottom:22px;display:flex;flex-direction:column;align-items:center;gap:5px;
  color:var(--mut);font-size:9px;letter-spacing:.16em;text-transform:uppercase;touch-action:none;user-select:none}
#lbGrab .ring{width:44px;height:44px;border:1px solid var(--line-2);border-radius:50%;display:grid;place-items:center;transition:.15s}
#lbGrab .ring svg{width:17px;height:17px}
#lbGrab:active .ring,#lbGrab.arming .ring{border-color:var(--amber);color:var(--amber);transform:scale(.92)}
@media(max-width:640px){#lbGrab{right:14px;bottom:14px}}

/* camera runs hidden */
#cam{position:fixed;width:2px;height:2px;opacity:.01;pointer-events:none;bottom:0;right:0}

#flash{position:fixed;inset:0;z-index:110;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 45%,rgba(240,166,63,.5),transparent 62%)}
#flash.go{animation:fl .7s ease-out}
@keyframes fl{0%{opacity:0}18%{opacity:1}100%{opacity:0}}

#drop{position:fixed;inset:0;z-index:150;display:none;align-items:center;justify-content:center;
  background:rgba(240,166,63,.1);backdrop-filter:blur(3px)}
#drop.on{display:flex}
#drop .dz{border:2px dashed var(--amber);border-radius:18px;padding:36px 46px;text-align:center;background:rgba(19,18,23,.92)}
#drop .dz svg{width:32px;height:32px;color:var(--amber);margin:0 auto 10px}
#drop .dz b{font-family:Syne;font-size:18px;display:block}
</style>
</head>
<body>

<header>
  <div class="brand">A.V.I.L.U.S<i>B9</i></div>
  <div class="actions">
    <button id="btnAdd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg><span>Photos</span></button>
    <button id="btnDemo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg><span>Demo</span></button>
  </div>
</header>

<main>
  <div id="grid"></div>
  <div id="empty">
    <div>
      <p>Drag &amp; drop photos here, or paste with Ctrl+V.</p>
      <button class="btn-solid" id="btnAdd2">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>Add photos
      </button>
    </div>
  </div>
</main>

<div id="lightbox" hidden>
  <img id="lbImg" alt="">
  <button id="lbDel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
  <button id="lbDl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>
  <button id="lbClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  <button id="lbGrab"><span class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11.5V9a2 2 0 0 0-2-2v1.3"/><path d="M14 10V4a2 2 0 0 0-2-2v8"/><path d="M10 10.5V6a2 2 0 0 0-2-2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg></span><span>hold</span></button>
</div>

<video id="cam" playsinline muted autoplay></video>
<div id="flash"></div>
<div id="drop"><div class="dz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg><b>Drop to add</b></div></div>
<input type="file" id="fileInput" accept="image/*" multiple hidden>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js"></script>
<script>
/* ================================================================
   A.V.I.L.U.S — BUILD 9 · SILENT GALLERY
   fist = pick up · hand leaves camera = carried in the air ·
   open palm at any paired device = lands there, vanishes here ·
   everything else runs in the background, no UI.
   ================================================================ */
const $=s=>document.querySelector(s);
const on=(el,ev,fn,o)=>el.addEventListener(ev,fn,o);
const lerp=(a,b,t)=>a+(b-a)*t;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const truncName=(s,n=28)=>s.length>n?s.slice(0,n-1)+'…':s;

const S={mode:'idle',hand:{present:false,ok:false,px:.5,py:.5,size:.15}};
let camOn=false,camTries=0;

function flashScreen(){const f=$('#flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');}

/* ---------------- photo library (IndexedDB) ---------------- */
const items=[];let itemId=0;
const DBX={db:null,ok:false};
function openDB(){return new Promise(res=>{try{
  const rq=indexedDB.open('avilus-photos',1);
  rq.onupgradeneeded=()=>{rq.result.createObjectStore('f',{keyPath:'id'});};
  rq.onsuccess=()=>{DBX.db=rq.result;DBX.ok=true;res();};
  rq.onerror=()=>res();
}catch(e){res();}});}
function dbSave(it){if(!DBX.ok||!it.file)return;
  try{DBX.db.transaction('f','readwrite').objectStore('f')
    .put({id:it.id,name:it.name,mime:it.file.type||'',size:it.file.size,blob:it.file,rx:it.received});}catch(e){}}
function dbDel(id){if(!DBX.ok)return;try{DBX.db.transaction('f','readwrite').objectStore('f').delete(id);}catch(e){}}
function dbLoad(){return new Promise(res=>{if(!DBX.ok)return res([]);
  try{const rq=DBX.db.transaction('f').objectStore('f').getAll();
    rq.onsuccess=()=>res(rq.result||[]);rq.onerror=()=>res([]);}catch(e){res([]);}});}

function isImage(f){return f&&(f.type.startsWith('image/')||/\.(jpe?g|png|gif|webp|bmp|avif)$/i.test(f.name));}
function ingestFile(f){
  if(!f||!isImage(f)||f.size>60*1048576)return;
  const it={id:++itemId,kind:'image',name:f.name,file:f,url:URL.createObjectURL(f),w:0,h:0,received:false};
  items.push(it);dbSave(it);probeSize(it);
}
function probeSize(it){
  const im=new Image();
  im.onload=()=>{it.w=im.naturalWidth;it.h=im.naturalHeight;
    const g=gridFigs.find(r=>r.it===it);if(g){g.a=it.w/it.h;relayout();}};
  im.src=it.url;
}
let gridFigs=[];
function renderGrid(){
  const grid=$('#grid');grid.textContent='';gridFigs=[];
  $('#empty').style.display=items.length?'none':'grid';
  gridFigs=items.map(it=>{
    const f=document.createElement('figure');
    if(it.received){const s=document.createElement('span');s.className='rx';s.textContent='RX';f.appendChild(s);}
    const img=new Image();img.loading='lazy';img.src=it.url;img.alt=it.name;
    f.appendChild(img);
    f.addEventListener('click',()=>openLightbox(it));
    grid.appendChild(f);
    return{it,f,a:(it.w&&it.h)?it.w/it.h:1.45};
  });
  relayout();
}
function markCarried(it,onOff){
  const g=gridFigs.find(r=>r.it===it);
  if(g)g.f.classList.toggle('carried',!!onOff);
}
function relayout(){
  const grid=$('#grid');const W=grid.clientWidth;if(!W)return;
  const gap=8,target=innerWidth>1000?236:innerWidth>640?184:122;
  let row=[],sum=0,y=0;
  const flush=h=>{let x=0;for(const r of row){const w=r.a*h;
    r.f.style.left=x+'px';r.f.style.top=y+'px';r.f.style.width=w+'px';r.f.style.height=h+'px';x+=w+gap;}
    y+=h+gap;row=[];sum=0;};
  for(const r of gridFigs){
    row.push(r);sum+=r.a;
    const h=(W-gap*(row.length-1))/sum;
    if(h<=target)flush(h);
  }
  if(row.length)flush(Math.min(target*1.35,(W-gap*(row.length-1))/sum));
  grid.style.height=Math.max(0,y-gap)+'px';
}

/* ---------------- demo roll (generated locally) ---------------- */
const POSTERS=[
 {n:'dusk',   sky:['#35235d','#d96a4f','#f2b47e'],sun:'#ffe3b3',m:['#4a2a55','#33204a','#1c1230']},
 {n:'night',  sky:['#0c1631','#16244a','#22335c'],sun:'#e8ecf5',m:['#101c3a','#0a1226','#060b1c'],stars:true},
 {n:'tide',   sky:['#0e3a3a','#2a6e62','#7fc4b4'],sun:'#f5e9c8',m:['#1c4a44','#123632','#0a2624']},
 {n:'ember',  sky:['#3a1420','#8c3230','#c65a3a'],sun:'#ffd9a8',m:['#57202a','#3c1620','#240d14']},
 {n:'sage',   sky:['#dfe8dc','#eef0e2','#f7f3e7'],sun:'#fff6df',m:['#9fb5a0','#7a947f','#5c7562']},
 {n:'strait', sky:['#123c5c','#3f789c','#9fc6dd'],sun:'#f2f6f2',m:['#1d5470','#143c54','#0c2838']},
];
const PSZ=[[960,1280],[1280,880],[1080,1080],[1120,1400],[1280,800],[980,1300]];
function lcg(seed){let s=(seed>>>0)||1;return()=>((s=(s*1664525+1013904223)>>>0)/4294967296);}
function makePoster(i){
  const P=POSTERS[i%6],[w,h]=PSZ[i%6];
  const rnd=lcg(i*104729+(Date.now()&0xffff));
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  const sky=x.createLinearGradient(0,0,0,h*.72);
  sky.addColorStop(0,P.sky[0]);sky.addColorStop(.62,P.sky[1]);sky.addColorStop(1,P.sky[2]);
  x.fillStyle=sky;x.fillRect(0,0,w,h);
  if(P.stars){for(let s2=0;s2<160;s2++){x.globalAlpha=.25+rnd()*.6;x.fillStyle='#dfe6f5';
    x.fillRect(rnd()*w,rnd()*h*.55,rnd()>.9?2.4:1.3,1.3);}x.globalAlpha=1;}
  const sx=w*(.3+rnd()*.4),sy=h*(.24+rnd()*.16),sr=Math.min(w,h)*(.07+rnd()*.04);
  const gl=x.createRadialGradient(sx,sy,sr*.4,sx,sy,sr*4);
  gl.addColorStop(0,P.sun+'cc');gl.addColorStop(1,P.sun+'00');
  x.fillStyle=gl;x.fillRect(0,0,w,h);
  x.fillStyle=P.sun;x.beginPath();x.arc(sx,sy,sr,0,7);x.fill();
  for(let k=0;k<3;k++){
    const base=h*(.5+.15*k),a1=h*(.035+rnd()*.05),a2=h*(.02+rnd()*.04),
      f1=.8+rnd()*1.6,f2=2.2+rnd()*2.4,p1=rnd()*7,p2=rnd()*7;
    x.fillStyle=P.m[k];x.beginPath();x.moveTo(0,h);
    for(let px=0;px<=w;px+=6){
      const t=px/w;
      x.lineTo(px,base+Math.sin(t*f1*3.1+p1)*a1+Math.sin(t*f2*3.1+p2)*a2);
    }
    x.lineTo(w,h);x.closePath();x.fill();
  }
  x.globalAlpha=.045;
  for(let g2=0;g2<900;g2++){x.fillStyle=rnd()>.5?'#fff':'#000';x.fillRect(rnd()*w,rnd()*h,1.4,1.4);}
  x.globalAlpha=1;
  return new Promise(res=>c.toBlob(bl=>{if(bl)res(new File([bl],
    `poster-${String(i%6+1).padStart(2,'0')} ${P.n}.jpg`,{type:'image/jpeg'}));},'image/jpeg',.92));
}
async function loadDemo(){
  const off=(Date.now()/60000|0);
  for(let i=0;i<6;i++){const f=await makePoster(i+off);if(f)ingestFile(f);}
  renderGrid();
}

/* ---------------- viewer + pickup ---------------- */
const LB={item:null,open:false,busy:false,pick:null,cx0:0,cy0:0};

function openLightbox(it,materialize=false){
  LB.item=it;LB.open=true;LB.busy=false;LB.pick=null;
  const img=$('#lbImg');
  img.classList.remove('armed','mat');
  img.style.transform='';img.style.opacity='';
  img.src=it.url;
  $('#lightbox').hidden=false;$('#lightbox').classList.remove('out');
  if(materialize){flashScreen();img.classList.add('mat');setTimeout(()=>img.classList.remove('mat'),700);}
}
function closeLightboxNow(){
  if(LB.busy)return;
  $('#lightbox').hidden=true;LB.open=false;LB.item=null;LB.pick=null;
  const img=$('#lbImg');img.style.transform='';img.style.opacity='';
}
function deleteCurrent(){
  if(LB.busy||!LB.item)return;
  const it=LB.item;
  const idx=items.indexOf(it);if(idx>-1)items.splice(idx,1);
  dbDel(it.id);
  try{URL.revokeObjectURL(it.url);}catch(e){}
  $('#lightbox').hidden=true;LB.open=false;LB.item=null;
  renderGrid();
}
function downloadCurrent(){
  if(!LB.item)return;
  const a=document.createElement('a');
  a.href=LB.item.url;a.download=LB.item.name||'photo.jpg';
  document.body.appendChild(a);a.click();a.remove();
}
function startPickup(){
  if(!LB.open||LB.busy)return;
  const img=$('#lbImg');
  if(!img.complete||!img.naturalWidth)return;
  if(S.mode!=='idle')return;
  LB.busy=true;
  img.classList.remove('armed');
  const r=img.getBoundingClientRect();
  LB.cx0=r.left+r.width/2;LB.cy0=r.top+r.height/2;
  LB.pick={phase:'lift',t:0};
}
function tickPickup(dt){
  const p=LB.pick;if(!p)return;
  p.t+=dt;
  const img=$('#lbImg');
  if(p.phase==='lift'){
    const k=Math.min(1,p.t/.5);
    img.style.transform=`translate(0,${(-14*k).toFixed(1)}px) scale(${(1+.06*k).toFixed(3)})`;
    if(k>=1){p.phase='fly';p.t=0;}
  }else{
    const k=Math.min(1,p.t/.35);
    img.style.transform=`translate(0,${(-14-26*k).toFixed(1)}px) scale(${(1.06+.08*k).toFixed(3)})`;
    img.style.opacity=String(1-k);
    if(k>=1){LB.pick=null;finishPickup();}
  }
}
function finishPickup(){
  enterHolding();
  $('#lightbox').hidden=true;
  LB.open=false;LB.busy=false;
  const img=$('#lbImg');img.style.transform='';img.style.opacity='';
}

/* ---------------- carry state machine ---------------- */
const CARRY={item:null};
function enterHolding(){
  CARRY.item=LB.item;
  S.mode='holding';
  markCarried(CARRY.item,true);
}
function enterCarrying(){
  if(!CARRY.item)return;
  S.mode='carrying';
  bcast({t:'carry',id:DEVID,name:CARRY.item.name});
}
function releaseBack(){ /* opened fist while hand still in view → put back */
  const it=CARRY.item;if(!it){S.mode='idle';return;}
  CARRY.item=null;markCarried(it,false);
  bcast({t:'cancel'});NET.carry=null;
  S.mode='idle';
}
function takeBack(){ /* open palm back at own device while carrying */
  const it=CARRY.item;if(!it){S.mode='idle';return;}
  CARRY.item=null;markCarried(it,false);
  bcast({t:'cancel'});NET.carry=null;
  S.mode='idle';
}

/* ---------------- hand tracking ---------------- */
const G={state:'none',open:1,openFrames:0,fistFrames:0,cool:0,lastHand:0};
const OPEN_TH=1.5, FIST_TH=1.33, MIN_SIZE=.05, COOL_MS=500, LOST_MS=700;
function openness(lm){
  const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  const palm=Math.max(1e-5,d(lm[0],lm[9]));
  let s=0;for(const i of[8,12,16,20])s+=d(lm[i],lm[0])/palm;
  return s/4;
}
function onHandResults(res){
  const lms=res.multiHandLandmarks;
  if(!lms||!lms.length){
    G.openFrames=0;G.fistFrames=0;S.hand.present=false;S.hand.ok=false;
    if(G.state!=='none')G.state='none';
    return;
  }
  const lm=lms[0],o=openness(lm);
  G.open=o;G.lastHand=performance.now();
  S.hand.present=true;
  S.hand.px=1-lm[9].x;S.hand.py=lm[9].y;
  S.hand.size=Math.hypot(lm[0].x-lm[9].x,lm[0].y-lm[9].y);
  S.hand.ok=S.hand.size>MIN_SIZE;
  let st=G.state;
  if(o>OPEN_TH){G.fistFrames=0;if(++G.openFrames>=3)st='open';}
  else if(o<FIST_TH){G.openFrames=0;if(++G.fistFrames>=3)st='fist';}
  else{G.openFrames=0;G.fistFrames=0;}
  if(st!==G.state){
    const prev=G.state;G.state=st;
    const nowMs=performance.now();
    if(S.hand.ok&&nowMs-G.cool>COOL_MS){
      if(prev==='open'&&st==='fist'){G.cool=nowMs;onGrabGesture();}
      else if(st==='open'){G.cool=nowMs;onOpenGesture();}
    }
  }
  if(LB.open&&!LB.busy)$('#lbImg').classList.toggle('armed',G.state==='open'&&S.hand.ok);
}
function onGrabGesture(){
  if(S.mode==='idle'&&LB.open&&!LB.busy)startPickup();
}
function onOpenGesture(){
  if(S.mode==='holding'){releaseBack();return;}
  if(S.mode==='carrying'){takeBack();return;}
  if(S.mode==='idle'&&!RX.busy&&NET.carry&&NET.carry.from!==DEVID)sendClaim();
}
async function startCamera(){
  try{
    const video=$('#cam');
    const stream=await navigator.mediaDevices.getUserMedia(
      {video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
    video.srcObject=stream;await video.play();
    camOn=true;
    if(typeof Hands==='undefined')return;
    const hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${f}`});
    hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.5,minTrackingConfidence:.5,selfieMode:false});
    hands.onResults(onHandResults);
    let busy=false;
    (function pump(){
      if(!busy&&video.readyState>=2){busy=true;hands.send({image:video}).catch(()=>{}).finally(()=>busy=false);}
      requestAnimationFrame(pump);
    })();
  }catch(e){/* silent — the hold button still works */}
}

/* ---------------- automatic room (silent) ---------------- */
const DEVID=Math.random().toString(36).slice(2,6);
const STAGE_ID='avilus-room-v9';
const NET={peer:null,link:null,conns:new Set(),connDev:new Map(),devs:new Map(),
  role:'—',run:true,carry:null,claimTs:0};
const RX={busy:false,meta:null,parts:[],got:0};

function linkedCount(){return NET.role==='stage'?NET.conns.size:(NET.link&&NET.link.open?1:0);}
function relay(d,fromConn){
  if(NET.role!=='stage')return;
  for(const c of NET.conns){if(c!==fromConn&&c.open){try{c.send(d);}catch(e){}}}
}
function bcast(msg){
  if(NET.role==='stage'){for(const c of NET.conns){if(c.open){try{c.send(msg);}catch(e){}}}}
  else if(NET.link&&NET.link.open){try{NET.link.send(msg);}catch(e){}}
}
function sendToId(msg,id){
  if(NET.role==='stage'){
    for(const[c,cid]of NET.connDev){if(c.open&&cid===id){try{c.send(msg);}catch(e){}}}
  }else if(NET.link&&NET.link.open){try{NET.link.send(msg);}catch(e){}}
}
function handleMsg(d,fromConn){
  if(!d||typeof d!=='object')return;
  if(d.t==='hi'||d.t==='hb'){
    if(fromConn)NET.connDev.set(fromConn,d.id);
    NET.devs.set(d.id,{ts:performance.now()});
    relay(d,fromConn);return;
  }
  if(d.t==='carry'){
    if(d.id!==DEVID&&S.mode==='idle')
      NET.carry={from:d.id,name:d.name,ts:performance.now()};
    relay(d,fromConn);return;
  }
  if(d.t==='cancel'||d.t==='gone'){
    NET.carry=null;
    relay(d,fromConn);return;
  }
  if(d.t==='claim'){
    if(S.mode==='carrying'&&CARRY.item&&d.id!==DEVID)winClaim(d.id);
    relay(d,fromConn);return;
  }
  const to=d.to||['*'];
  if(to.includes('*')||to.includes(DEVID))receiveMsg(d);
  if(NET.role==='stage'){
    const star=to.includes('*');
    for(const[c,id]of NET.connDev){
      if(c!==fromConn&&c.open&&(star||to.includes(id))){try{c.send(d);}catch(e){}}
    }
  }
}
function bindConn(c){
  NET.conns.add(c);
  try{c.send({t:'hi',id:DEVID});}catch(e){}
  c.on('data',d=>handleMsg(d,c));
  c.on('close',()=>{
    NET.conns.delete(c);
    for(const[cc,id]of NET.connDev)if(cc===c){NET.connDev.delete(cc);NET.devs.delete(id);}
    if(NET.link===c)NET.link=null;
    if(NET.role==='client')setTimeout(netInit,2000);
  });
  c.on('error',()=>{});
}
function netInit(){
  if(!NET.run)return;
  try{NET.peer&&NET.peer.destroy();}catch(e){}
  NET.link=null;NET.conns.clear();NET.connDev.clear();
  const claim=new Peer(STAGE_ID,{debug:0});NET.peer=claim;
  claim.on('open',()=>{
    NET.role='stage';
    claim.on('connection',c=>bindConn(c));
  });
  claim.on('error',e=>{
    if(e.type==='unavailable-id'){try{claim.destroy();}catch(x){}joinRoom();}
    else if(e.type==='peer-unavailable'){try{NET.peer&&NET.peer.destroy();}catch(x){}setTimeout(netInit,2500);}
    else if(e.type!=='network')setTimeout(netInit,4000);
  });
}
function joinRoom(){
  if(!NET.run)return;
  const p=new Peer({debug:0});NET.peer=p;NET.role='client';
  p.on('open',()=>{
    const c=p.connect(STAGE_ID,{reliable:true});
    c.on('open',()=>{NET.link=c;bindConn(c);});
    c.on('error',()=>{try{p.destroy();}catch(x){}});
  });
  p.on('error',e=>{
    if(e.type==='peer-unavailable'){try{p.destroy();}catch(x){}setTimeout(netInit,2500);}
  });
}
setInterval(()=>{
  const m={t:'hb',id:DEVID};
  if(NET.role==='stage')handleMsg(m,null);
  else if(NET.link&&NET.link.open){try{NET.link.send(m);}catch(e){}}
  const now=performance.now();
  for(const[id,v]of NET.devs)if(now-v.ts>6000)NET.devs.delete(id);
},900);
setInterval(()=>{
  if(S.mode==='carrying'&&CARRY.item)bcast({t:'carry',id:DEVID,name:CARRY.item.name});
  if(NET.carry&&performance.now()-NET.carry.ts>6000)NET.carry=null;
},2000);

/* ---------------- claim → release ---------------- */
function sendClaim(){
  if(!NET.carry||NET.carry.from===DEVID)return;
  const now=performance.now();
  if(now-NET.claimTs<1500)return;
  NET.claimTs=now;
  bcast({t:'claim',id:DEVID});
}
async function winClaim(claimId){
  const it=CARRY.item;if(!it)return;
  CARRY.item=null;NET.carry=null;
  S.mode='sending';
  try{
    sendToId({t:'tx',to:[claimId],name:it.name,mime:it.file.type||'image/jpeg',size:it.file.size},claimId);
    const CH=65536;let off=0;
    const dc=(NET.role==='stage'?[...NET.conns][0]:NET.link)?.dataChannel;
    while(off<it.file.size){
      if(dc&&dc.bufferedAmount>4194304){await sleep(25);continue;}
      const buf=await it.file.slice(off,off+CH).arrayBuffer();
      sendToId({t:'chunk',to:[claimId],b:buf},claimId);
      off+=buf.byteLength;
    }
    sendToId({t:'end',to:[claimId]},claimId);
    /* move semantics: the photo leaves this device */
    const idx=items.indexOf(it);if(idx>-1)items.splice(idx,1);
    dbDel(it.id);
    try{URL.revokeObjectURL(it.url);}catch(e){}
    renderGrid();
    bcast({t:'gone'});
  }catch(e){
    items.push(it);dbSave(it);markCarried(it,false);renderGrid();
  }
  S.mode='idle';
}
function receiveMsg(d){
  if(d.t==='tx'){
    RX.meta={name:d.name,mime:d.mime,size:d.size};RX.parts=[];RX.got=0;RX.busy=true;
  }else if(d.t==='chunk'&&RX.busy){
    const b=d.b instanceof ArrayBuffer?new Uint8Array(d.b):new Uint8Array(d.b.buffer,d.b.byteOffset,d.b.byteLength);
    RX.parts.push(b);RX.got+=b.byteLength;
  }else if(d.t==='end'&&RX.busy)finishRx();
}
async function finishRx(){
  const meta=RX.meta;if(!meta)return;
  const blob=new Blob(RX.parts,{type:meta.mime});RX.parts=[];RX.busy=false;RX.meta=null;
  const file=new File([blob],meta.name,{type:meta.mime});
  const it={id:++itemId,kind:'image',name:file.name,file,url:URL.createObjectURL(file),w:0,h:0,received:true};
  items.push(it);dbSave(it);probeSize(it);
  renderGrid();
  NET.carry=null;
  openLightbox(it,true);
}

/* ---------------- main loop ---------------- */
let lastT=performance.now();
function tick(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  if(LB.pick)tickPickup(dt);
  if(S.mode==='holding'&&performance.now()-G.lastHand>LOST_MS)enterCarrying();
  requestAnimationFrame(tick);
}

/* ---------------- wiring ---------------- */
on($('#btnAdd'),'click',()=>$('#fileInput').click());
on($('#btnAdd2'),'click',()=>$('#fileInput').click());
on($('#btnDemo'),'click',()=>loadDemo());
on($('#fileInput'),'change',e=>{[...e.target.files].forEach(ingestFile);renderGrid();e.target.value='';});
on($('#lbClose'),'click',closeLightboxNow);
on($('#lbDel'),'click',deleteCurrent);
on($('#lbDl'),'click',downloadCurrent);
on($('#lightbox'),'click',e=>{if(e.target.id==='lightbox')closeLightboxNow();});
on(document,'keydown',e=>{if(e.key==='Escape'&&LB.open)closeLightboxNow();});
let dragDepth=0;
on(window,'dragenter',e=>{
  if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){dragDepth++;$('#drop').classList.add('on');}
});
on(window,'dragover',e=>e.preventDefault());
on(window,'dragleave',()=>{dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)$('#drop').classList.remove('on');});
on(window,'drop',e=>{
  e.preventDefault();dragDepth=0;$('#drop').classList.remove('on');
  const fs=[...(e.dataTransfer?e.dataTransfer.files:[])].filter(isImage);
  if(fs.length){fs.forEach(ingestFile);renderGrid();}
});
on(window,'paste',e=>{
  const fs=[...(e.clipboardData?e.clipboardData.files:[])].filter(isImage);
  if(fs.length){fs.forEach(ingestFile);renderGrid();}
});
on($('#lbGrab'),'contextmenu',e=>e.preventDefault());
let armTimer=0;
on($('#lbGrab'),'pointerdown',()=>{
  $('#lbGrab').classList.add('arming');
  armTimer=setTimeout(()=>{startPickup();},550);
});
on($('#lbGrab'),'pointerup',()=>{
  clearTimeout(armTimer);$('#lbGrab').classList.remove('arming');
  if(S.mode==='holding')releaseBack();
  else if(S.mode==='carrying')takeBack();
});
on($('#lbGrab'),'pointerleave',()=>{clearTimeout(armTimer);$('#lbGrab').classList.remove('arming');});
on(window,'pointerdown',()=>{ /* silent camera retry if the first ask failed */
  if(!camOn&&camTries<3){camTries++;startCamera();}
},{capture:true});
let rsz=0;
on(window,'resize',()=>{clearTimeout(rsz);rsz=setTimeout(relayout,150);});

/* ---------------- boot: everything silent ---------------- */
(async function init(){
  camTries=1;startCamera();
  netInit();
  await openDB();
  const recs=await dbLoad();
  for(const r of recs){
    try{
      const f=new File([r.blob],r.name,{type:r.mime||'image/jpeg'});
      if(!isImage(f))continue;
      const it={id:r.id,kind:'image',name:r.name,file:f,url:URL.createObjectURL(f),w:0,h:0,received:!!r.rx};
      items.push(it);probeSize(it);
    }catch(e){}
  }
  if(items.length)itemId=items.reduce((m,i)=>Math.max(m,i.id),0);
  renderGrid();
  if(!items.length)await loadDemo();
  requestAnimationFrame(tick);
})();
</script>
